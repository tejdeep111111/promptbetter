[package]
name = "ai-evaluator"
version = "0.1.0"
edition = "2024"

[dependencies]
#axum like Spring Web
axum = "0.7"

#tokio Async runtime like Java's thread pool
tokio = { version = "1", features = ["full"] }

#serde & serde_json: Like jackson in Java
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

#reqwest: HTTP client to make POST calls to Groq API (like Spring's RestClint)
reqwest = { version = "0.12", features = ["json"] }

#dotenvy
dotenvy = "0.15"


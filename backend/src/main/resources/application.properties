#APPLICATION_NAME
spring.application.name=prompt-better

#SERVER_PORT
server.port=8080

#MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/promptbetter
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#AI
api.key=${API_KEY}
api.base-url=https://api.groq.com/openai/v1/chat/completions
ai.model=${AI_MODEL:openai/gpt-oss-20b}

#JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

#JWT
jwt.secret=${PROMPTBETTER_JWT_SECRET}
jwt.expiration=86400000

#CORS
cors.allowed-origins=*

#ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,loggers,caches,env
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

#Application info
info.app.name=PromptBetter
info.app.version=1.0.0
info.app.description=AI Prompt Engineering Practice Platform
management.info.env.enabled=true

#RATELIMITER
app.submissionIntervalMs=10000

#EVALUATION
# Final score is derived directly from the three rubric dimensions (clarity,
# specificity, context). When the skill a challenge teaches is not demonstrated,
# the score is capped at teaching-miss-cap.
app.evaluation.judge-temperature=0.1
app.evaluation.teaching-miss-cap=55
